# Perspective Taking Text CoT Training Configuration (8 GPU)
# Dataset: perspective_textcot (detailed reasoning without image generation)
# Pure text reasoning - no output images, only text output with detailed CoT
# Total samples: 20531

unified_edit:
  dataset_names:
  - perspective_textcot
  enable_vae: False
  image_transform_args:
    image_stride: 16
    max_image_size: 1024
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  is_mandatory: True
  num_used_data:
  - 20531
  weight: 1
