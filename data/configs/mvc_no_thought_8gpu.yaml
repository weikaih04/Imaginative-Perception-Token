# Multi-View Counting - No Thought Baseline (8 GPU)
# Dataset: mvc_no_thought
# This is a baseline that only trains on text output without intermediate visual thought
# Total samples: 17079

unified_edit:
  dataset_names:
  - mvc_no_thought
  enable_vae: False
  image_transform_args:
    image_stride: 16
    max_image_size: 1024
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  is_mandatory: True
  num_used_data:
  - 17079
  weight: 1
