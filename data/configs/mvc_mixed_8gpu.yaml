# MVC Mixed: 50% Visual CoT + 50% Answer-Only (8 GPU)
# Uses dataloader-level mixing of two datasets
# Resume from MVC Latent64 25k checkpoint, train for 2k steps
# Visual CoT: 17079 samples (VLM_THINK_SYSTEM_PROMPT + full VCoT output)
# Answer-Only: 17079 samples (ANSWER_ONLY_SYSTEM_PROMPT + <answer>X</answer>)

unified_edit:
  dataset_names:
  - multi_view_counting
  - mvc_answeronly
  image_transform_args:
    image_stride: 16
    max_image_size: 1024
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  is_mandatory: True
  num_used_data:
  - 17079
  - 17079
  weight: 1
