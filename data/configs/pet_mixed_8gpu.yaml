# PET Mixed: 50% Visual CoT + 50% Answer-Only (8 GPU)
# Uses dataloader-level mixing of two datasets
# Resume from PET Latent64 best checkpoint, train for 2k steps
# Visual CoT: 20531 samples (VLM_THINK_SYSTEM_PROMPT + full VCoT output)
# Answer-Only: 20531 samples (ANSWER_ONLY_SYSTEM_PROMPT + <answer>X</answer>)

unified_edit:
  dataset_names:
  - perspective_with_sysprompt
  - pet_answeronly
  image_transform_args:
    image_stride: 16
    max_image_size: 1024
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  is_mandatory: True
  num_used_data:
  - 20531
  - 20531
  weight: 1
