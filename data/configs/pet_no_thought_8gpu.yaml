# Perspective Taking - No Thought Baseline (8 GPU)
# Dataset: perspective_no_thought
# This is a baseline that only trains on image generation without intermediate thought text
# Pure VLM training - no output images, only text output
# Total samples: 20531

unified_edit:
  dataset_names:
  - perspective_no_thought
  enable_vae: False
  image_transform_args:
    image_stride: 16
    max_image_size: 1024
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  is_mandatory: True
  num_used_data:
  - 20531
  weight: 1
